<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>BiurkoOS — symulator biura</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #12131a;
    font-family: ui-rounded, system-ui, 'Segoe UI', sans-serif; user-select: none; }
  #hud { position: fixed; left: 14px; bottom: 14px; width: 272px; padding: 12px 14px;
    background: rgba(18,22,28,.84); border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
    color: #e8e2d4; font-size: 13px; line-height: 1.5; z-index: 20; pointer-events: none; }
  #hud .title { font-size: 15px; letter-spacing: .06em; color: #ffd9a8; margin-bottom: 6px; }
  #hud .task { display: flex; justify-content: space-between; }
  #hud .task.done { color: #8fd08a; }
  #hud .pay { margin-top: 8px; color: #ffc978; font-size: 14px; }
  #hud .hint { margin-top: 7px; font-size: 11px; color: #9aa0a8; }
  #msg { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); padding: 8px 16px;
    background: rgba(18,22,28,.85); border-radius: 10px; color: #ffe9c8; font-size: 14px;
    opacity: 0; transition: opacity .25s; z-index: 20; pointer-events: none; max-width: 80vw; }
  #msg.show { opacity: 1; }
  #win { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; background: rgba(12,10,8,.55); z-index: 30; pointer-events: none;
    color: #fff3dc; text-align: center; }
  #win.show { display: flex; }
  #win .cat { font-size: 64px; }
  #win .big { font-size: 26px; margin: 10px 0 4px; }
  #win .sub { font-size: 14px; color: #c9b98f; margin-top: 6px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.7.0/dist/aframe.min.js"></script>
</head>
<body>
<div id="hud">
  <div class="title">BiurkoOS</div>
  <div id="tasks"></div>
  <div class="pay" id="pay">Wypłata: 0 zł</div>
  <div class="hint">Kliknij kartkę, żeby ją podnieść. Kliknij jeszcze raz, żeby odłożyć. WASD i mysz do ruchu po pokoju.</div>
  <div class="hint">Katalogi też są przedmiotami. Możesz je podnosić i przenosić na biurko.</div>
  <div class="hint" id="xrstate"></div>
</div>
<div id="msg"></div>
<div id="win"><div class="cat">😺</div><div class="big">Zmiana zakończona</div><div id="winsum"></div><div class="sub">Możesz zamknąć stronę albo posprzątać kartki na podłodze</div></div>

<a-scene xr-held-pose renderer="antialias: true; colorManagement: true" background="color: #12131a">
  <a-entity id="cam" camera="fov: 72" look-controls wasd-controls position="0 1.6 1.9"></a-entity>

  <a-entity light="type: hemisphere; color: #b8c6d6; groundColor: #6b5238; intensity: 0.85"></a-entity>
  <a-entity light="type: directional; color: #ffe9d2; intensity: 1.2; castShadow: true; shadowMapWidth: 1024; shadowMapHeight: 1024; shadowCameraLeft: -4; shadowCameraRight: 4; shadowCameraTop: 4.5; shadowCameraBottom: -3; shadowCameraNear: 0.5; shadowCameraFar: 12; shadowBias: -0.0003" position="-2.6 2.4 0.6"></a-entity>
  <a-entity light="type: point; color: #ffd9b0; intensity: 0.8; distance: 6" position="0.4 2.1 0.2"></a-entity>

  <a-plane position="0 0 0" rotation="-90 0 0" width="7" height="7" material="color: #8f6b4a; roughness: 0.9" receiveShadow="true"></a-plane>
  <a-plane position="0 3.2 0" rotation="90 0 0" width="7" height="7" material="color: #e0d2bd"></a-plane>
  <a-plane position="0 1.6 -2.8" width="7" height="3.2" material="color: #c9a47f" receiveShadow="true"></a-plane>
  <a-plane position="0 1.6 2.8" width="7" height="3.2" rotation="0 180 0" material="color: #c9a47f" receiveShadow="true"></a-plane>
  <a-plane position="-3 1.6 0" width="7" height="3.2" rotation="0 90 0" material="color: #c1a07d" receiveShadow="true"></a-plane>
  <a-plane position="3 1.6 0" width="7" height="3.2" rotation="0 -90 0" material="color: #c1a07d" receiveShadow="true"></a-plane>
  <a-plane position="-2.98 1.9 0.3" width="1.0" height="0.75" rotation="0 90 0" material="color: #d9ecff; shader: flat"></a-plane>

  <a-plane position="0 0.012 0.9" rotation="-90 0 0" width="2.6" height="1.8" material="color: #5c6b62; roughness: 0.95" receiveShadow="true"></a-plane>

  <a-box position="0 0.75 -0.45" width="1.6" height="0.06" depth="0.75" material="color: #6f4a2f; roughness: 0.7" castShadow="true" receiveShadow="true"></a-box>
  <a-box position="-0.7 0.375 -0.72" width="0.07" height="0.72" depth="0.07" material="color: #5b3b24" castShadow="true"></a-box>
  <a-box position="0.7 0.375 -0.72" width="0.07" height="0.72" depth="0.07" material="color: #5b3b24" castShadow="true"></a-box>
  <a-box position="-0.7 0.375 -0.18" width="0.07" height="0.72" depth="0.07" material="color: #5b3b24" castShadow="true"></a-box>
  <a-box position="0.7 0.375 -0.18" width="0.07" height="0.72" depth="0.07" material="color: #5b3b24" castShadow="true"></a-box>
  <a-box position="0.02 0.79 -0.2" width="0.44" height="0.03" depth="0.15" material="color: #2c313a" castShadow="true"></a-box>
  <a-box position="0.42 0.79 -0.18" width="0.07" height="0.03" depth="0.1" material="color: #3a414c" castShadow="true"></a-box>
  <a-cylinder position="-0.62 0.84 -0.55" radius="0.05" height="0.12" material="color: #b2603c; roughness: 0.6" castShadow="true"></a-cylinder>

  <a-box position="0 1.16 -0.76" width="1.2" height="0.76" depth="0.05" material="color: #232931" castShadow="true"></a-box>
  <a-box position="0 0.82 -0.77" width="0.06" height="0.38" depth="0.06" material="color: #2c333d" castShadow="true"></a-box>
  <a-box position="0 0.79 -0.77" width="0.3" height="0.02" depth="0.24" material="color: #2c333d" castShadow="true"></a-box>

  <a-box position="0 1.18 -2.42" width="3.2" height="0.06" depth="0.35" material="color: #6f4a2f; roughness: 0.7" castShadow="true" receiveShadow="true"></a-box>
  <a-box position="-1.5 0.95 -2.42" width="0.05" height="0.44" depth="0.3" material="color: #5b3b24" castShadow="true"></a-box>
  <a-box position="1.5 0.95 -2.42" width="0.05" height="0.44" depth="0.3" material="color: #5b3b24" castShadow="true"></a-box>

  <a-entity position="1.5 1.24 -2.42">
    <a-cylinder radius="0.09" height="0.14" material="color: #b2603c; roughness: 0.6" castShadow="true"></a-cylinder>
    <a-sphere position="0 0.17 0" radius="0.11" material="color: #5a7a4e" castShadow="true"></a-sphere>
    <a-sphere position="0.08 0.23 0.04" radius="0.07" material="color: #6b8f5c" castShadow="true"></a-sphere>
    <a-sphere position="-0.07 0.22 -0.05" radius="0.06" material="color: #4f6b46" castShadow="true"></a-sphere>
  </a-entity>

  <a-entity id="bin" position="1.12 0 -0.55">
    <a-cylinder position="0 0.21 0" radius="0.24" height="0.42" open-ended="true"
      material="color: #99a2aa; metalness: 0.2; roughness: 0.55; side: double" castShadow="true"></a-cylinder>
    <a-circle position="0 0.02 0" rotation="-90 0 0" radius="0.23" material="color: #55606a; roughness: 0.6"></a-circle>
    <a-torus position="0 0.42 0" rotation="90 0 0" radius="0.24" radius-tubular="0.022"
      material="color: #aab3bb; metalness: 0.3; roughness: 0.4" castShadow="true"></a-torus>
  </a-entity>
  <a-entity light="type: point; color: #9fb0bd; intensity: 0.4; distance: 3" position="1.12 0.9 -0.55"></a-entity>

  <a-entity position="1.12 0.3 -0.31" geometry="plane: width 0.3; height 0.12"
    material="color: #3d4750; shader: flat"></a-entity>
  <a-entity id="binlabel" position="1.12 0.3 -0.305"></a-entity>

  <a-entity id="poster" position="-2.96 1.7 0.9" rotation="0 90 0"></a-entity>
</a-scene>

<script>
const sceneEl = document.querySelector('a-scene');
const NEED = { dokumenty: 2, memey: 2, archiwum: 2, kosz: 2 };
const counts = { dokumenty: 0, memey: 0, archiwum: 0, kosz: 0 };
let salary = 0, done = 0, win = false;
const BIN = { x: 1.12, y: 0.42, z: -0.55 };
const FOLDER_DEFS = [
  { key: 'dokumenty', label: '~/Dokumenty', color: '#c98f3a', x: -1.15 },
  { key: 'memey',     label: '~/Memey',     color: '#a3568a', x: 0 },
  { key: 'archiwum',  label: '~/Archiwum',  color: '#557f52', x: 1.15 },
];
const PAPERS = [
  { id: 'faktura1', name: 'faktura_01.pdf',     dest: 'dokumenty', icon: '🧾', tint: '#b8813a', x: -0.55, z: -0.25 },
  { id: 'faktura2', name: 'faktura_02.pdf',     dest: 'dokumenty', icon: '🧾', tint: '#b8813a', x: -0.3,  z: -0.55 },
  { id: 'raport',   name: 'raport_q3.txt',      dest: 'archiwum',  icon: '📊', tint: '#587f55', x: 0.1,   z: -0.3 },
  { id: 'draft',    name: 'stary_draft.txt',    dest: 'archiwum',  icon: '📝', tint: '#587f55', x: 0.35,  z: -0.6 },
  { id: 'kot',      name: 'kot_mem.gif',        dest: 'memey',     icon: '😺', tint: '#96507c', x: -0.12, z: -0.72 },
  { id: 'garfild',  name: 'garfild_foto.jpg',   dest: 'memey',     icon: '😻', tint: '#96507c', x: 0.55,  z: -0.45 },
  { id: 'log',      name: 'system.log.bak',     dest: 'kosz',      icon: '🗾', tint: '#7d8690', x: 0.22,  z: -0.15 },
  { id: 'spam',     name: 'spam_email.eml',     dest: 'kosz',      icon: '📧', tint: '#7d8690', x: -0.45, z: -0.75 },
];

function stdMat(color, roughness, metalness) {
  return new THREE.MeshStandardMaterial({ color, roughness: roughness ?? 0.65, metalness: metalness ?? 0.05 });
}
function darker(hex, k) {
  const c = new THREE.Color(hex); c.multiplyScalar(k); return '#' + c.getHexString();
}
function makeCanvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
  g.closePath(); g.fill();
}

const folders = [], papers = [], paperById = {};
let grabEls = [];

function buildFolder(d) {
  const el = document.createElement('a-entity');
  el.setAttribute('position', `${d.x} 1.44 -2.34`);
  el.classList.add('grab', 'folder');
  el.__meta = { key: d.key };
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.52, 0.08), stdMat(d.color, 0.6, 0.08));
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.05, 0.12), stdMat(darker(d.color, 0.6), 0.5, 0.1));
  mouth.position.y = 0.27;
  body.castShadow = mouth.castShadow = true;
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.canvas.width = 320; ctx.canvas.height = 96;
  const tex = new THREE.CanvasTexture(ctx.canvas); tex.anisotropy = 4;
  const label = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.14), new THREE.MeshBasicMaterial({ map: tex }));
  label.position.set(0, 0.15, 0.045);
  el.object3D.add(body, mouth, label);
  sceneEl.appendChild(el);
  const f = { key: d.key, label: d.label, color: d.color, el, ctx, tex, body };
  folders.push(f);
  drawFolderLabel(f);
}
function drawFolderLabel(f) {
  const g = f.ctx;
  g.fillStyle = darker(f.color, 0.45); g.fillRect(0, 0, 320, 96);
  g.fillStyle = '#ffffff'; g.font = 'bold 26px sans-serif'; g.textBaseline = 'middle';
  g.fillText(f.label, 14, 48);
  g.font = 'bold 22px sans-serif'; g.fillStyle = '#ffe9c8';
  g.fillText(`${counts[f.key]}/${NEED[f.key]}${counts[f.key] === NEED[f.key] ? ' ✓' : ''}`, 210, 48);
  f.tex.needsUpdate = true;
}

function paperTex(p) {
  return makeCanvasTex(256, 352, g => {
    g.fillStyle = '#f7f1e4'; g.fillRect(0, 0, 256, 352);
    g.fillStyle = p.tint; g.fillRect(0, 0, 256, 56);
    g.fillStyle = '#ffffff'; g.textBaseline = 'middle';
    g.font = '34px sans-serif'; g.fillText(p.icon, 12, 28);
    g.font = 'bold 20px sans-serif'; g.fillText(p.name, 56, 28);
    g.fillStyle = '#c8bfa9';
    for (let i = 0; i < 7; i++) g.fillRect(16, 92 + i * 30, 180 - (i % 3) * 44, 10);
    g.fillStyle = '#efe6d4'; g.beginPath(); g.moveTo(256, 352); g.lineTo(256, 322); g.lineTo(226, 352); g.closePath(); g.fill();
    g.fillStyle = '#9b8f7c'; g.font = '14px sans-serif'; g.fillText('BiurkoOS', 16, 330);
  });
}
function buildPaper(p) {
  const el = document.createElement('a-entity');
  el.classList.add('grab', 'paper');
  el.__meta = { id: p.id, dest: p.dest, name: p.name, baseY: 0.84, phase: Math.random() * 6.28 };
  const mat = new THREE.MeshStandardMaterial({ map: paperTex(p), roughness: 0.85, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.21, 0.29), mat);
  mesh.castShadow = true;
  el.setObject3D('mesh', mesh);
  el.__mat = mat;
  el.setAttribute('position', `${p.x} 0.84 ${p.z}`);
  el.object3D.rotation.set(0, (Math.random() - 0.5) * 0.6, 0);
  sceneEl.appendChild(el);
  papers.push(el); paperById[p.id] = el;
}

let screenTex, screenCtx, hudTex, hudCtx;
function buildScreen() {
  screenCtx = document.createElement('canvas').getContext('2d'); screenCtx.canvas.width = 680; screenCtx.canvas.height = 420;
  screenTex = new THREE.CanvasTexture(screenCtx.canvas); screenTex.anisotropy = 4;
  const el = document.createElement('a-entity');
  el.setObject3D('mesh', new THREE.Mesh(new THREE.PlaneGeometry(1.12, 0.68),
    new THREE.MeshBasicMaterial({ map: screenTex })));
  el.setAttribute('position', '0 1.16 -0.733');
  sceneEl.appendChild(el);
  drawScreen();
}
function dirRows(g, x, y) {
  g.font = 'bold 20px sans-serif'; g.textBaseline = 'middle';
  const keys = [
    { key: 'dokumenty', label: '~/Dokumenty', color: '#c98f3a' },
    { key: 'memey', label: '~/Memey', color: '#a3568a' },
    { key: 'archiwum', label: '~/Archiwum', color: '#557f52' },
    { key: 'kosz', label: '~/Trash', color: '#8b939b' },
  ];
  keys.forEach((k, i) => {
    g.fillStyle = k.color; g.beginPath(); g.arc(x + 8, y + i * 30, 6, 0, 6.28); g.fill();
    g.fillStyle = '#dfe6ee'; g.fillText(k.label, x + 22, y + i * 30);
    g.fillStyle = counts[k.key] === NEED[k.key] ? '#8fd08a' : '#ffc978';
    g.fillText(`${counts[k.key]}/${NEED[k.key]}${counts[k.key] === NEED[k.key] ? ' ✓' : ''}`, x + 250, y + i * 30);
  });
}
function drawScreen() {
  const g = screenCtx;
  g.fillStyle = '#141b23'; g.fillRect(0, 0, 680, 420);
  g.fillStyle = '#2b3846'; roundRect(g, 14, 14, 652, 40, 8);
  g.fillStyle = '#ffd9a8'; g.font = 'bold 20px sans-serif'; g.textBaseline = 'middle';
  g.fillText('BiurkoOS', 28, 34);
  g.fillStyle = '#9fb0bd'; g.font = '15px sans-serif'; g.fillText('pulpit dnia zmiany', 460, 34);
  g.fillStyle = '#c6d0da'; g.font = 'bold 16px sans-serif'; g.fillText('Katalogi', 28, 80);
  dirRows(g, 28, 108);
  g.fillStyle = '#2b3846'; g.fillRect(14, 232, 652, 2);
  g.fillStyle = '#dfe6ee'; g.font = 'bold 17px sans-serif';
  g.fillText(`Zadania dnia: ${done}/8`, 28, 264);
  g.fillStyle = '#ffc978'; g.fillText(`Wypłata: ${salary} zł`, 240, 264);
  g.fillStyle = '#7f8b97'; g.font = '13px sans-serif';
  g.fillText('podnieś kartkę, wrzuć do katalogu albo do kosza obok biurka', 28, 300);
  g.fillText('kartki leżą na biurku · katalogi stoją na półce', 28, 324);
  if (win) {
    g.fillStyle = 'rgba(20,27,35,.93)'; g.fillRect(0, 0, 680, 420);
    g.font = '90px sans-serif'; g.textAlign = 'center'; g.fillText('😺', 340, 170);
    g.fillStyle = '#ffe9c8'; g.font = 'bold 34px sans-serif'; g.fillText('Zmiana zakończona', 340, 250);
    g.fillStyle = '#ffc978'; g.font = '22px sans-serif'; g.fillText(`Wypłata ${salary} zł`, 340, 300);
    g.textAlign = 'left';
  }
  screenTex.needsUpdate = true;
}
function buildHud3d() {
  hudCtx = document.createElement('canvas').getContext('2d'); hudCtx.canvas.width = 420; hudCtx.canvas.height = 300;
  hudTex = new THREE.CanvasTexture(hudCtx.canvas); hudTex.anisotropy = 4;
  const el = document.createElement('a-entity');
  el.setObject3D('mesh', new THREE.Mesh(new THREE.PlaneGeometry(0.85, 0.6),
    new THREE.MeshBasicMaterial({ map: hudTex })));
  el.setAttribute('position', '-2.93 1.42 -0.9');
  el.setAttribute('rotation', '0 90 0');
  sceneEl.appendChild(el);
  drawHud3d();
}
function drawHud3d() {
  const g = hudCtx;
  g.fillStyle = '#18202a'; roundRect(g, 0, 0, 420, 300, 14);
  g.fillStyle = '#ffd9a8'; g.font = 'bold 18px sans-serif'; g.textBaseline = 'middle';
  g.fillText('BiurkoOS', 18, 26);
  dirRows(g, 18, 64);
  g.fillStyle = '#33424f'; g.fillRect(14, 186, 392, 2);
  g.fillStyle = '#dfe6ee'; g.font = 'bold 16px sans-serif';
  g.fillText(`Zadania: ${done}/8`, 18, 210);
  g.fillStyle = '#ffc978'; g.fillText(`Wypłata: ${salary} zł`, 220, 210);
  g.fillStyle = '#7f8b97'; g.font = '12px sans-serif';
  g.fillText('trigger albo klik podnosi i odkłada', 18, 246);
  if (win) { g.font = '44px sans-serif'; g.fillText('😺', 300, 250); }
  hudTex.needsUpdate = true;
}

const BIN_LABEL = makeCanvasTex(220, 84, g => {
  g.fillStyle = '#3d4750'; g.fillRect(0, 0, 220, 84);
  g.fillStyle = '#dfe6ee'; g.font = 'bold 26px sans-serif'; g.textBaseline = 'middle';
  g.fillText('KOSZ', 24, 42);
});
function buildBinLabel() {
  document.getElementById('binlabel').setObject3D('mesh',
    new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.12), new THREE.MeshBasicMaterial({ map: BIN_LABEL })));
}
function buildPoster() {
  const tex = makeCanvasTex(256, 320, g => {
    g.fillStyle = '#2b3846'; g.fillRect(0, 0, 256, 320);
    g.fillStyle = '#f7f1e4'; g.fillRect(14, 14, 228, 292);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '150px sans-serif'; g.fillText('🐱', 128, 126);
    g.fillStyle = '#6b5f4c'; g.font = 'bold 18px sans-serif'; g.fillText('garfild_foto.jpg', 128, 252);
    g.textAlign = 'left';
  });
  document.getElementById('poster').setObject3D('mesh',
    new THREE.Mesh(new THREE.PlaneGeometry(0.38, 0.48), new THREE.MeshBasicMaterial({ map: tex })));
}

function refreshGrabList() { grabEls = folders.map(f => f.el).concat(papers); }

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let held = null, downPos = null;

function walkUp(obj) {
  while (obj) { if (obj.el && obj.el.classList.contains('grab')) return obj.el; obj = obj.parent; }
  return null;
}
function rayScreen(e) {
  if (!sceneEl.camera) return null;
  const rect = sceneEl.renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - rect.left) / rect.width * 2 - 1, -((e.clientY - rect.top) / rect.height * 2 - 1));
  ray.setFromCamera(ndc, sceneEl.camera);
  const hits = ray.intersectObjects(grabEls.map(el => el.object3D), true);
  return hits.length ? walkUp(hits[0].object) : null;
}

const mouseNDC = new THREE.Vector2();
let mouseSeen = false, hoverEl = null;
window.addEventListener('mousemove', e => {
  if (!sceneEl.renderer) return;
  const rect = sceneEl.renderer.domElement.getBoundingClientRect();
  mouseNDC.set((e.clientX - rect.left) / rect.width * 2 - 1, -((e.clientY - rect.top) / rect.height * 2 - 1));
  mouseSeen = true;
});
function rayNDC() {
  if (!sceneEl.camera || !mouseSeen || !grabEls.length) return null;
  ray.setFromCamera(mouseNDC, sceneEl.camera);
  const hits = ray.intersectObjects(grabEls.map(el => el.object3D), true);
  return hits.length ? walkUp(hits[0].object) : null;
}
function highlightTick() {
  let h = null;
  if (!held) {
    if (sceneEl.is('vr-mode')) h = ctrlEls.find(c => c.__hover)?.__hover ?? null;
    else h = rayNDC();
  }
  if (hoverEl && hoverEl !== h && hoverEl.__mat) hoverEl.__mat.emissive.setHex(0x000000);
  hoverEl = h;
  if (hoverEl && hoverEl.__mat) hoverEl.__mat.emissive.setHex(0x261c0e);
  folders.forEach(f => {
    const glow = held && held.el.__meta && held.el.__meta.dest === f.key;
    f.body.material.emissive.setHex(glow ? 0x2c2108 : 0x000000);
  });
}

function grabEntity(el, mode, ctrl) {
  held = { el, mode, ctrl };
  el.object3D.scale.set(1.06, 1.06, 1.06);
  const what = el.classList.contains('folder') ? 'katalog ' + el.__meta.key : el.__meta.name;
  if (el.__scored) { msg('Ta kartka już leży tam, gdzie trzeba. Odłóż ją z powrotem.'); return; }
  const where = el.classList.contains('folder') ? 'Odłóż katalog gdzie chcesz.'
    : el.__meta.dest === 'kosz' ? 'Cel: kosz obok biurka.'
    : 'Cel: ' + folders.find(f => f.key === el.__meta.dest).label + '.';
  msg('Podniesiono ' + what + ' · ' + where + ' Kliknij lub naciśnij trigger, żeby odłożyć.');
}
function release() {
  const el = held.el;
  el.object3D.scale.set(1, 1, 1);
  if (held.proxy) sceneEl.object3D.remove(held.proxy);
  held = null;
  if (el.classList.contains('folder')) { fallFolder(el); return; }
  dropPaper(el, zoneFor(el.object3D.position));
}
function zoneFor(pos) {
  for (const f of folders) {
    const fp = f.el.object3D.position;
    const dx = pos.x - fp.x, dz = pos.z - fp.z;
    if (dx * dx + dz * dz < 0.25 && pos.y > fp.y - 0.2 && pos.y < fp.y + 0.75) return f.key;
  }
  const dx = pos.x - BIN.x, dz = pos.z - BIN.z;
  if (dx * dx + dz * dz < 0.2 && pos.y > BIN.y - 0.08) return 'kosz';
  return null;
}

const tweens = [];
function tween(el, to, dur, doneFn, scaleTo) {
  tweens.push({ el, from: el.object3D.position.clone(),
    to: new THREE.Vector3(to[0], to[1], to[2]),
    fromScale: el.object3D.scale.x, scaleTo: scaleTo ?? 1, t: 0, dur, doneFn });
}
function advanceTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt;
    let k = Math.min(1, tw.t / tw.dur);
    k = k * k * (3 - 2 * k);
    tw.el.object3D.position.lerpVectors(tw.from, tw.to, k);
    const s = tw.fromScale + (tw.scaleTo - tw.fromScale) * k;
    tw.el.object3D.scale.set(s, s, s);
    if (tw.t >= tw.dur) {
      tw.el.object3D.position.copy(tw.to);
      if (tw.el.__meta) tw.el.__meta.baseY = tw.to.y;
      if (tw.doneFn) tw.doneFn();
      tweens.splice(i, 1);
    }
  }
}

function fallPaper(el) {
  const p = el.object3D.position;
  const onDesk = p.x > -0.85 && p.x < 0.85 && p.z > -0.86 && p.z < -0.06;
  const y = onDesk ? 0.80 : 0.03;
  tween(el, [p.x, y, p.z], 0.55, () => { el.object3D.rotation.set(-90, el.object3D.rotation.y, 0); });
}
function fallFolder(el) {
  const p = el.object3D.position;
  const onDesk = p.x > -0.85 && p.x < 0.85 && p.z > -0.86 && p.z < -0.06;
  const y = onDesk ? 1.04 : 0.26;
  tween(el, [p.x, y, p.z], 0.45, () => { el.object3D.rotation.set(0, el.object3D.rotation.y, 0); });
  msg('Katalog odłożony. Teraz wrzucaj do niego kartki.');
}
function dropPaper(el, zone) {
  if (el.__scored) { fallPaper(el); msg(el.__meta.name + ' już trafiła do celu. Odłóż ją gdzie chcesz.'); return; }
  if (zone === null) { fallPaper(el); msg(el.__meta.name + ' odłożona. Sprawdź, gdzie powinna trafić.'); return; }
  if (el.__meta.dest === zone) success(el, zone); else fail(el, zone);
}
function success(el, zone) {
  el.__scored = true;
  counts[zone]++; done++; salary += 45;
  if (zone === 'kosz') {
    const ox = Math.random() * 0.26 - 0.13, oz = Math.random() * 0.26 - 0.13;
    const idx = counts.kosz - 1;
    tween(el, [BIN.x + ox, 0.09 + idx * 0.05, BIN.z + oz], 0.5,
      () => { el.object3D.rotation.set(-70, Math.random() * 3, 0); el.classList.remove('grab'); el.__placed = true; }, 0.55);
    thud();
    msg(el.__meta.name + ' ląduje w koszu. +45 zł');
  } else {
    const f = folders.find(x => x.key === zone);
    const fp = f.el.object3D.position;
    tween(el, [fp.x, fp.y + 0.12, fp.z + 0.05], 0.45, () => { el.object3D.visible = false; el.classList.remove('grab'); el.__placed = true; }, 0.3);
    correct();
    msg(f.label + ' przyjęła plik ' + el.__meta.name + '. +45 zł');
  }
  folders.forEach(drawFolderLabel);
  drawScreen(); drawHud3d(); drawDomHud();
  if (done === PAPERS.length) winRound();
}
function fail(el, zone) {
  salary -= 20;
  wrong();
  const where = zone === 'kosz' ? 'kosza' : folders.find(x => x.key === zone).label;
  msg(el.__meta.name + ' nie pasuje do ' + where + '. -20 zł');
  el.object3D.visible = true;
  let base;
  if (zone === 'kosz') base = [BIN.x, BIN.y + 0.12, BIN.z + 0.35];
  else { const fp = folders.find(x => x.key === zone).el.object3D.position; base = [fp.x, fp.y + 0.3, fp.z + 0.45]; }
  tween(el, [base[0], base[1], base[2]], 0.35, () => fallPaper(el), 1);
  drawScreen(); drawHud3d(); drawDomHud();
}

function winRound() {
  win = true;
  salary += 300;
  document.getElementById('win').classList.add('show');
  document.getElementById('winsum').textContent = `Wypłata ${salary} zł · 8 zadań · Garfild jest dumny 🧡`;
  drawScreen(); drawHud3d(); drawDomHud();
  winJingle();
  const cat = document.createElement('a-entity');
  cat.setObject3D('mesh', new THREE.Mesh(new THREE.PlaneGeometry(0.45, 0.45),
    new THREE.MeshBasicMaterial({ map: makeCanvasTex(256, 256, g => { g.font = '170px sans-serif'; g.textBaseline = 'middle'; g.textAlign = 'center'; g.fillText('😺', 128, 130); }) })));
  cat.setAttribute('position', '0.85 1.45 -0.62');
  cat.__cat = true;
  sceneEl.appendChild(cat);
}

let ac = null;
function ensureAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function beep(freq, dur, type, gain) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type ?? 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(gain ?? 0.05, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
}
function correct() { beep(660, 0.12); setTimeout(() => beep(880, 0.15), 90); }
function wrong() { beep(180, 0.22, 'square', 0.06); }
function thud() { beep(120, 0.18, 'triangle', 0.07); }
function winJingle() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'sine', 0.06), i * 150)); }

let msgTimer = null;
function msg(text) {
  const m = document.getElementById('msg');
  m.textContent = text; m.classList.add('show');
  clearTimeout(msgTimer); msgTimer = setTimeout(() => m.classList.remove('show'), 2200);
}
function drawDomHud() {
  const rows = [
    { key: 'dokumenty', label: '~/Dokumenty' }, { key: 'memey', label: '~/Memey' },
    { key: 'archiwum', label: '~/Archiwum' }, { key: 'kosz', label: 'Kosz obok biurka' },
  ];
  document.getElementById('tasks').innerHTML = rows.map(r =>
    `<div class="task${counts[r.key] === NEED[r.key] ? ' done' : ''}"><span>${r.label}</span><span>${counts[r.key]}/${NEED[r.key]}${counts[r.key] === NEED[r.key] ? ' ✓' : ''}</span></div>`).join('');
  document.getElementById('pay').textContent = 'Wypłata: ' + salary + ' zł';
  if (win) document.getElementById('winsum').textContent =
    `Wypłata ${salary} zł · 8 zadań · Garfild jest dumny 🧡`;
}

const ctrlEls = [];
let gamepadPress = false;
function buildControllers() {
  ['left', 'right'].forEach(hand => {
    const c = document.createElement('a-entity');
    c.setAttribute('laser-controls', 'hand: ' + hand);
    c.setAttribute('raycaster', 'objects: .grab; far: 30; lineColor: #ffd9a8');
    sceneEl.appendChild(c);
    c.addEventListener('mousemove', e => { c.__hover = walkUp(e.detail.intersection.object); });
    c.addEventListener('mouseleave', () => { c.__hover = null; });
    c.addEventListener('triggerdown', () => {
      ensureAudio(); gamepadPress = true;
      if (held) release();
      else if (c.__hover) grabEntity(c.__hover, 'ctrl', c);
    });
    c.addEventListener('triggerup', () => { gamepadPress = false; });
    c.addEventListener('click', e => {
      if (gamepadPress) return;
      ensureAudio();
      const hit = e.detail && e.detail.intersection ? walkUp(e.detail.intersection.object) : null;
      if (held) release();
      else if (hit) grabEntity(hit, 'ctrl', c);
    });
    ctrlEls.push(c);
  });
}
function rayFromPose(pose) {
  const m = new THREE.Matrix4().fromArray(pose.transform.matrix);
  ray.set(new THREE.Vector3().setFromMatrixPosition(m),
    new THREE.Vector3(0, 0, -1).transformDirection(m));
  const hits = ray.intersectObjects(grabEls.map(el => el.object3D), true);
  return { hit: hits.length ? walkUp(hits[0].object) : null, matrix: m };
}
sceneEl.addEventListener('enter-vr', () => {
  if (!ctrlEls.length) buildControllers();
  const sess = sceneEl.xrSession;
  if (sess && !sess.__grabHooked) {
    sess.__grabHooked = true;
    sess.addEventListener('selectstart', ev => {
      if (gamepadPress) return;
      ensureAudio();
      const sys = sceneEl.systems['tracked-controls-webxr'];
      const ref = sys && sys.referenceSpace;
      if (!ref) return;
      const pose = ev.frame.getPose(ev.inputSource.targetRaySpace, ref);
      if (!pose) return;
      const r = rayFromPose(pose);
      if (held) release();
      else if (r.hit) {
        const proxy = new THREE.Object3D();
        proxy.matrix.copy(r.matrix); proxy.matrixWorld.copy(r.matrix);
        sceneEl.object3D.add(proxy);
        grabEntity(r.hit, 'ctrl', null);
        held.proxy = proxy; held.inputSource = ev.inputSource;
      }
    });
  }
  msg('WebXR działa. Trigger podnosi kartkę, drugi trigger ją odkłada.');
});
sceneEl.addEventListener('exit-vr', () => { if (held) release(); gamepadPress = false; });

AFRAME.registerComponent('xr-held-pose', {
  tick(time, delta, xrFrame) {
    if (!xrFrame || !held || !held.proxy || !held.inputSource) return;
    const sys = sceneEl.systems['tracked-controls-webxr'];
    const ref = sys && sys.referenceSpace;
    if (!ref) return;
    const pose = xrFrame.getPose(held.inputSource.targetRaySpace, ref);
    if (!pose) return;
    held.proxy.matrix.fromArray(pose.transform.matrix);
    held.proxy.updateMatrixWorld(true);
  }
});

sceneEl.addEventListener('mousedown', e => { downPos = { x: e.clientX, y: e.clientY }; ensureAudio(); });
window.addEventListener('mouseup', e => {
  if (!downPos) return;
  const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (dist > 8) return;
  if (held) { release(); return; }
  const hit = rayScreen(e);
  if (hit) grabEntity(hit, 'cam');
});

const camPos = new THREE.Vector3(), camDir = new THREE.Vector3(), ctrlFwd = new THREE.Vector3();
const ctrlQ = new THREE.Quaternion(), ctrlP = new THREE.Vector3();
let lastT = 0;
function loop(t) {
  const dt = Math.min((t - lastT) / 1000, 0.05); lastT = t;
  if (held) {
    const o = held.el.object3D;
    if (held.mode === 'cam' && sceneEl.camera) {
      sceneEl.camera.getWorldPosition(camPos);
      sceneEl.camera.getWorldDirection(camDir);
      o.position.copy(camPos).addScaledVector(camDir, 0.62);
      o.quaternion.copy(sceneEl.camera.quaternion);
    } else if (held.mode === 'ctrl') {
      const src = held.ctrl ? held.ctrl.object3D : held.proxy;
      if (src) {
        src.getWorldPosition(ctrlP);
        src.getWorldQuaternion(ctrlQ);
        ctrlFwd.set(0, 0, -1).applyQuaternion(ctrlQ);
        o.position.copy(ctrlP).addScaledVector(ctrlFwd, 0.22);
        o.position.y += 0.06;
        o.quaternion.copy(ctrlQ);
      }
    }
  }
  advanceTweens(dt);
  highlightTick();
  const tt = t / 1000;
  papers.forEach(el => {
    if (held && held.el === el) return;
    if (tweens.some(tw => tw.el === el)) return;
    if (!el.object3D.visible) return;
    el.object3D.position.y = el.__meta.baseY + Math.sin(tt * 1.8 + el.__meta.phase) * 0.015;
  });
  sceneEl.object3D.children.forEach(c => {
    if (c.el && c.el.__cat) c.position.y = 1.45 + Math.sin(tt * 2.5) * 0.04;
  });
  requestAnimationFrame(loop);
}

sceneEl.addEventListener('loaded', () => {
  FOLDER_DEFS.forEach(buildFolder);
  PAPERS.forEach(buildPaper);
  buildScreen(); buildHud3d(); buildBinLabel(); buildPoster();
  refreshGrabList();
  drawDomHud();
  document.getElementById('xrstate').textContent = navigator.xr
    ? 'WebXR dostępny. Przycisk ENTER VR w prawym dolnym rogu zabierze Cię do pokoju.'
    : 'Brak WebXR w tej przeglądarce. Na biurku pracuje się myszą i WASD.';
  requestAnimationFrame(loop);
});

window.BIURKO = {
  paperById, folders, BIN,
  grab: id => grabEntity(paperById[id], 'cam'),
  release: () => { if (held) release(); },
  heldId: () => held ? (held.el.__meta.id || held.el.__meta.key) : null,
  moveTo: (id, x, y, z) => paperById[id].object3D.position.set(x, y, z),
  state: () => ({ counts, salary, done, win }),
};
</script>
</body>
</html>
